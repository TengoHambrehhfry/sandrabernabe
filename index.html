/* Animación oscilante */
@keyframes floatFluid {
  0%   { transform: translate(0px, 0px); }
  10%  { transform: translate(3px, -2px); }
  20%  { transform: translate(-2px, 3px); }
  30%  { transform: translate(4px, -3px); }
  40%  { transform: translate(-3px, 2px); }
  50%  { transform: translate(2px, -4px); }
  60%  { transform: translate(-4px, 3px); }
  70%  { transform: translate(3px, -2px); }
  80%  { transform: translate(-2px, 4px); }
  90%  { transform: translate(1px, -3px); }
  100% { transform: translate(0px, 0px); }
}

.animate-float-fluid {
  animation: floatFluid 8s infinite ease-in-out;
}

/* Variaciones */
.animate-float-1 { animation-duration: 7s; animation-delay: 0s; }
.animate-float-2 { animation-duration: 9s; animation-delay: 1s; }
.animate-float-3 { animation-duration: 8.5s; animation-delay: 2s; }
.animate-float-4 { animation-duration: 7.5s; animation-delay: 1.5s; }


</style>

	<!-- Lightbox Overlay -->
<!-- Lightbox Overlay -->
<!-- Lightbox Overlay simple -->
<div id="lightbox" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center hidden z-[9999]">
  <span id="lightbox-close" class="absolute top-4 right-6 text-white text-3xl cursor-pointer z-[10000]">&times;</span>
  <img id="lightbox-img" src="" alt="Preview" class="max-h-[90%] max-w-[90%] rounded-lg shadow-lg">
</div>




	<script>
	// Selecciona todas las imágenes de FAVORITOS
const favoriteImages = document.querySelectorAll('#projects .media-card img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxClose = document.getElementById('lightbox-close');

favoriteImages.forEach(img => {
  img.addEventListener('click', () => {
    lightboxImg.src = img.src;
    lightbox.classList.remove('hidden'); // Muestra el overlay
  });
});

// Cerrar con X o clic fuera de la imagen
function closeLightbox() {
  lightbox.classList.add('hidden');
}

lightboxClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => {
  if (e.target === lightbox) closeLightbox();
});



	</script>
